name: Inspect Nina deploy privileges

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-nina.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub SSH and sudo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set +e
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
            chmod 600 "$HOME/.ssh/known_hosts"
            echo "=== PRIVATE REPO AFTER HOST KEY ==="
            git ls-remote git@github.com:gb69prof/Nina-saga.git HEAD
            echo "GIT_SSH_STATUS=$?"
            echo "=== SUDO CHECK ==="
            sudo -n true
            echo "SUDO_STATUS=$?"
            echo "=== CADDY READ VIA SUDO ==="
            sudo -n head -n 120 /opt/gbprof/Caddyfile
            echo "CADDY_READ_STATUS=$?"
