name: Deploy to gbprof server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ispeziona Caddy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -u
            repo=/opt/gbprof/projects/gbprof-home
            cd "$repo"
            git fetch origin
            git reset --hard origin/main

            echo "=== CADDYFILE PERMESSI ==="
            ls -l /opt/gbprof/Caddyfile 2>&1 || true
            test -r /opt/gbprof/Caddyfile && echo "LEGGIBILE=SI" || echo "LEGGIBILE=NO"
            test -w /opt/gbprof/Caddyfile && echo "SCRIVIBILE=SI" || echo "SCRIVIBILE=NO"

            echo "=== CADDYFILE CONTENUTO ==="
            cat /opt/gbprof/Caddyfile 2>&1 || true

            echo "=== ADMIN API CADDY ==="
            code="$(curl -sS --max-time 5 -o /tmp/caddy-config.json -w '%{http_code}' http://127.0.0.1:2019/config/ 2>/dev/null || true)"
            echo "HTTP_ADMIN=$code"
            if [ "$code" = "200" ]; then
              head -c 2000 /tmp/caddy-config.json
              echo
            fi

            echo "=== PROCESSI CADDY ==="
            ps aux | grep '[c]addy' 2>&1 || true
