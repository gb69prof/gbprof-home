name: Deploy to gbprof server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH e verifica le pagine pubbliche
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            repo=/opt/gbprof/projects/gbprof-home
            web=/opt/gbprof/www/Spazi
            cd "$repo"
            git fetch origin
            git reset --hard origin/main
            test -f "$repo/Spazi/index.html"
            if [ -L "$web" ]; then
              test "$(readlink -f "$web")" = "$(readlink -f "$repo/Spazi")"
            elif [ -e "$web" ]; then
              echo "Il percorso pubblico Spazi esiste e non è un collegamento: intervento manuale necessario" >&2
              exit 1
            else
              ln -s "$repo/Spazi" "$web"
            fi
            test -f "$web/index.html"
            test "$(curl -sS -L --max-time 15 -o /dev/null -w '%{http_code}' https://gbprof.it/Spazi/)" = 200
            curl -fsSL --max-time 15 https://gbprof.it/Spazi/ | grep -Fq 'Spazi e passioni'
            curl -fsSL --max-time 15 https://gbprof.it/ | grep -Fq 'class="portal portal-spazi" href="/Spazi/"'
            echo "Deploy gbprof-home e pagina Spazi verificati"
            git log -1 --oneline
