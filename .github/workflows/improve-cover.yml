name: Improve gbprof cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-cover.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Improve cover
        run: |
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter
          from pathlib import Path

          path = Path('assets/gbprof-cover.webp')
          img = Image.open(path).convert('RGB')
          target = (1672, 941)
          if img.size != target:
              img = img.resize(target, Image.Resampling.LANCZOS)
          img = ImageEnhance.Contrast(img).enhance(1.04)
          img = ImageEnhance.Sharpness(img).enhance(1.18)
          img = img.filter(ImageFilter.UnsharpMask(radius=1.2, percent=115, threshold=3))
          img.save(path, 'WEBP', quality=78, method=6)
          print('cover:', img.size, path.stat().st_size, 'bytes')
          PY

      - name: Clean temporary transfer files
        run: rm -rf .cover-b64 .cover-hex .cover-hex16

      - name: Commit improved cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Improve gbprof cover quality"
            git push
          fi
