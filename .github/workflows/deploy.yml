name: Deploy to gbprof server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ispeziona web server Docker
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -u
            repo=/opt/gbprof/projects/gbprof-home
            cd "$repo"
            git fetch origin
            git reset --hard origin/main

            echo "=== DOCKER PS ==="
            docker ps --format '{{.Names}}|{{.Image}}|{{.Ports}}' 2>&1 || true

            echo "=== COMPOSE FILES ==="
            find /opt/gbprof -maxdepth 3 \( -name 'docker-compose.yml' -o -name 'docker-compose.yaml' -o -name 'compose.yml' -o -name 'compose.yaml' \) -print 2>/dev/null || true

            echo "=== CADDY FILES ==="
            find /opt/gbprof -maxdepth 4 \( -iname 'Caddyfile' -o -iname '*caddy*.conf' \) -print 2>/dev/null || true

            echo "=== LISTENERS ==="
            ss -ltn 2>/dev/null | grep -E ':(80|443)\b' || true
