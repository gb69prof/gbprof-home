name: Deploy to gbprof server

on:
  push:
    branches:
      - main
    paths-ignore:
      - REPORT.md

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH e verifica le pagine pubbliche
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            repo=/opt/gbprof/projects/gbprof-home
            cd "$repo"
            echo "DIAGNOSTICA HOME"
            for p in /opt/gbprof/www /opt/gbprof/www/index.html /var/www/html /var/www/html/index.html; do
              if [ -e "$p" ] || [ -L "$p" ]; then ls -ld "$p"; readlink -f "$p" || true; fi
            done
            if [ -r /opt/gbprof/Caddyfile ]; then grep -nE 'root |file_server|handle' /opt/gbprof/Caddyfile || true; fi
            echo "FINE DIAGNOSTICA HOME"
            # Preserve the generated homepage before updating; stop for other edits.
            status="$(git status --porcelain)"
            if [ -n "$status" ]; then
              if [ "$status" = " M index.html" ]; then
                git stash push -m "Backup index prima della prova animata" -- index.html
              else
                echo "Deploy interrotto: modifiche locali da conservare."
                git status --short
                exit 1
              fi
            fi
            git fetch origin
            git merge --ff-only origin/main
            # Rigenera la homepage da Spazi/index.html, senza modificare le altre porte.
            python3 tools/bundle-home.py
            echo "DIAGNOSTICA CONTENUTO"
            sha256sum index.html /opt/gbprof/www/index.html
            curl -fsSL --max-time 20 https://gbprof.it/ | sha256sum
            for url in "https://gbprof.it/" "https://gbprof.it/?verifica_home=animated"; do
              curl -fsSL --max-time 20 "$url" | grep -o 'data-animated=' | wc -l || true
              curl -fsSL --max-time 20 "$url" | grep -o 'finger-motion' | wc -l || true
            done
            echo "FINE DIAGNOSTICA CONTENUTO"
            test -s "$repo/Spazi/lultima-cosa-che-so/index.html"
            # The existing Spazi publication serves the laboratory without new
            # server-level links or broader deployment permissions.
            test -s "$repo/Spazi/come-lavoro/index.html"
            for asset in index.html style.css assets/come-lavoro-720.webp assets/come-lavoro-1448.webp; do
              curl -fsSL --max-time 20 -o /dev/null "https://gbprof.it/Spazi/come-lavoro/$asset"
            done
            curl -fsSL --max-time 20 https://gbprof.it/Spazi/come-lavoro/ | grep -Fq 'id="work-title"'
            test -f "$repo/Spazi/index.html"
            # Verifica ed eventualmente monta la cartella Spazi senza modificare
            # gli altri progetti pubblicati. Il comando privilegiato e non interattivo.
            test -s "$repo/Spazi/fiumana-scroll-infinito/index.html"
            public_spazi=/opt/gbprof/www/Spazi
            if [ ! -e "$public_spazi" ] && [ ! -L "$public_spazi" ]; then
              if ln -s "$repo/Spazi" "$public_spazi" 2>/dev/null; then
                echo "Spazi collegato tramite permessi deploy"
              elif sudo -n ln -s "$repo/Spazi" "$public_spazi" 2>/dev/null; then
                echo "Spazi collegato tramite sudo autorizzato"
              else
                echo "Spazi non collegato: permessi server insufficienti; rimane GitHub Pages"
              fi
            fi
            if [ -L "$public_spazi" ]; then
              echo "Spazi symlink: $(readlink "$public_spazi")"
            fi
            if [ -r /opt/gbprof/Caddyfile ]; then
              grep -nE 'root |file_server|handle_path|reverse_proxy' /opt/gbprof/Caddyfile || true
            fi
            for asset in "" style.css site.js hero-fiumana-scroll.webp paper.pdf; do
              code="$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "https://gbprof.it/Spazi/fiumana-scroll-infinito/$asset")"
              echo "gbprof.it Fiumana: ${asset:-index.html} HTTP $code"
            done
            public_fiumana=https://gbprof.it/Spazi/fiumana-scroll-infinito/
            test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$public_fiumana")" = 200
            test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "${public_fiumana}style.css")" = 200
            test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "${public_fiumana}site.js")" = 200
            test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "${public_fiumana}hero-fiumana-scroll.webp")" = 200
            test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "${public_fiumana}paper.pdf")" = 200
            echo "Fiumana pubblicata su gbprof.it con risorse raggiungibili"
            test "$(curl -sS -L --max-time 15 -o /dev/null -w '%{http_code}' https://gbprof.it/)" = 200
            curl -fsSL --max-time 15 https://gbprof.it/ | grep -Fq 'class="portal portal-spazi" href="#spazi"'
            curl -fsSL --max-time 15 https://gbprof.it/ | grep -Fq '<section id="spazi" class="directory-view"'
            curl -fsSL --max-time 15 https://gbprof.it/ | grep -Fq 'PWA in costruzione'
            curl -fsSL --max-time 15 https://gbprof.it/ | grep -Fq 'Apri UTILITY →'
            ! curl -fsSL --max-time 15 https://gbprof.it/ | grep -Fq 'Spazio · Presentazioni'
            curl -fsSL --max-time 15 https://gbprof.it/ | grep -Fq 'https://gbprof.it/Spazi/fiumana-scroll-infinito/'
            echo "Deploy gbprof-home e sezione Strumenti verificati"
            public_gravity=https://gbprof.it/Spazi/gravity-lab-3d/
            for asset in "" css/style.css js/main.js js/ui.js js/scene.js js/physics.js js/interaction.js js/canvas-renderer.js vendor/three.module.js vendor/three.core.js vendor/OrbitControls.js vendor/LICENSE; do
              code="$(curl -fsSL --max-time 30 -o /dev/null -w '%{http_code}' "${public_gravity}${asset}")"
              test "$code" = 200
              echo "Gravity Lab: ${asset:-index.html} HTTP $code"
            done
            curl -fsSL --max-time 15 https://gbprof.it/ | grep -Fq 'https://gbprof.it/Spazi/gravity-lab-3d/'
            curl -fsSL --max-time 15 https://gbprof.it/Spazi/ | grep -Fq 'https://gbprof.it/Spazi/gravity-lab-3d/'
            echo "Gravity Lab pubblicato con tutte le risorse e collegamenti verificati"
            echo "Verifica pubblicazione del romanzo di Libera"
            public_novel=https://gbprof.it/Spazi/lultima-cosa-che-so/
            test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$public_novel")" = 200
            test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "${public_novel}copertina.webp")" = 200
            curl -fsSL --max-time 20 "$public_novel" | grep -Fq 'id="cap-12"'
            # Verifica l'intera continuazione (capitoli XIII–XXIV) e la navigazione.
            public_novel_next=https://gbprof.it/Spazi/lultima-cosa-che-so/parte-seconda/
            test "$(curl -sSL --max-time 20 -o /dev/null -w '%{http_code}' "$public_novel_next")" = 200
            curl -fsSL --max-time 20 "$public_novel_next" | grep -Fq 'id="cap-13"'
            curl -fsSL --max-time 20 "$public_novel_next" | grep -Fq 'id="cap-24"'
            curl -fsSL --max-time 20 "$public_novel" | grep -Fq 'href="parte-seconda/"'
            curl -fsSL --max-time 20 https://gbprof.it/Spazi/ | grep -Fq 'Continua · Parte seconda'
            curl -fsSL --max-time 20 https://gbprof.it/ | grep -Fq 'Continua · Parte seconda'
            echo "La parte seconda è pubblicata, integrale e raggiungibile dalla prima e dagli Spazi"
            # Terza e quarta parte: verifica dei testi e della continuità dei capitoli.
            public_novel_three=https://gbprof.it/Spazi/lultima-cosa-che-so/parte-terza/
            public_novel_four=https://gbprof.it/Spazi/lultima-cosa-che-so/parte-quarta/
            for page in "$public_novel_three" "$public_novel_four"; do
              test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "$page")" = 200
            done
            curl -fsSL --max-time 25 "$public_novel_three" | grep -Fq 'id="cap-25"'
            curl -fsSL --max-time 25 "$public_novel_three" | grep -Fq 'id="cap-36"'
            curl -fsSL --max-time 25 "$public_novel_four" | grep -Fq 'id="cap-37"'
            curl -fsSL --max-time 25 "$public_novel_four" | grep -Fq 'id="cap-48"'
            curl -fsSL --max-time 25 "$public_novel_next" | grep -Fq 'href="../parte-terza/#cap-25"'
            curl -fsSL --max-time 25 "$public_novel_three" | grep -Fq 'href="../parte-quarta/#cap-37"'
            curl -fsSL --max-time 25 "$public_novel" | grep -Fq 'href="parte-quarta/"'
            curl -fsSL --max-time 25 https://gbprof.it/Spazi/ | grep -Fq 'Parte quarta · La voce richiesta'
            curl -fsSL --max-time 25 https://gbprof.it/ | grep -Fq 'Parte quarta · La voce richiesta'
            echo "Quattro parti, quarantotto capitoli e navigazione continua verificati"
            curl -fsSL --max-time 20 https://gbprof.it/Spazi/ | grep -Fq 'romanzo-libera-title'
            curl -fsSL --max-time 20 https://gbprof.it/ | grep -Fq 'romanzo-libera-title'
            echo "Romanzo integrale, copertina e homepage verificati"
            echo "Verifica NeuroLab: file, collegamento e pubblicazione"
            test -s "$repo/Spazi/neuro-lab/index.html"
            test -s "$repo/Spazi/neuro-lab/style.css"
            test -s "$repo/Spazi/neuro-lab/main.js"
            public_neuro=https://gbprof.it/Spazi/neuro-lab/
            for asset in "" style.css main.js; do
              code="$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "$public_neuro$asset")"
              test "$code" = 200
              echo "NeuroLab asset $asset HTTP $code"
            done
            curl -fsSL --max-time 25 "$public_neuro" | grep -Fq 'id="senseList"'
            curl -fsSL --max-time 25 "$public_neuro"main.js | grep -Fq 'const SENSES ='
            curl -fsSL --max-time 25 https://gbprof.it/ | grep -Fq '/Spazi/neuro-lab/'
            curl -fsSL --max-time 25 https://gbprof.it/Spazi/ | grep -Fq '/Spazi/neuro-lab/'
            # NeuroLab 3.0: ritratto realistico, percorsi interattivi e guida vocale.
            for asset in narration.js assets/anatomy-portrait.webp assets/stimuli.webp assets/neural-details.webp; do
              test -s "$repo/Spazi/neuro-lab/$asset"
              test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "$public_neuro$asset")" = 200
            done
            curl -fsSL --max-time 25 "$public_neuro" | grep -Fq 'id="voicePlay"'
            curl -fsSL --max-time 25 "$public_neuro" | grep -Fq 'assets/anatomy-portrait.webp'
            curl -fsSL --max-time 25 "$public_neuro" | grep -Fq 'id="journeySteps"'
            curl -fsSL --max-time 25 "$public_neuro"narration.js | grep -Fq 'SpeechSynthesisUtterance'
            # Il report resta alla radice sorgente, che non è la directory pubblica.
            test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' https://gbprof.it/REPORT.md)" = 404
            test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "${public_neuro}REPORT.md")" = 404
            echo "NeuroLab 3.0: asset e report escluso dalla pubblicazione verificati"
            echo "NeuroLab pubblicato e raggiungibile dagli Spazi"
            echo "Verifica i due archivi, senza esporre il diario privato"
            for url in "https://gbprof.it/Spazi/archivio/" "https://gbprof.it/Spazi/libera-autonoma/" "https://gbprof.it/Spazi/libera-autonoma/style.css" "https://gbprof.it/Spazi/libera-autonoma/archive.js" "https://gbprof.it/Spazi/libera-autonoma/manifest.json"; do
              test "$(curl -sSL --max-time 25 -o /dev/null -w '%{http_code}' "$url")" = 200
            done
            curl -fsSL --max-time 25 https://gbprof.it/ | grep -Fq 'class="portal portal-archivio" href="/Spazi/archivio/"'
            curl -fsSL --max-time 25 https://gbprof.it/Spazi/archivio/ | grep -Fq 'Libera autonoma'
            curl -fsSL --max-time 25 https://gbprof.it/Spazi/libera-autonoma/ | grep -Fq 'id="archive-list"'
            test "$(curl -sSL --max-time 15 -o /dev/null -w '%{http_code}' https://gbprof.it/Spazi/libera-autonoma/REPORT.md)" = 404
            echo "Libera autonoma: porte e risorse pubbliche verificate"
            git log -1 --oneline
