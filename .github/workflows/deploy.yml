name: Deploy to gbprof server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ispeziona configurazione pubblicazione
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -u
            repo=/opt/gbprof/projects/gbprof-home
            cd "$repo"
            git fetch origin
            git reset --hard origin/main

            echo "=== FILE PROVA ==="
            ls -l "$repo/Prove-ingresso-invalsi/Ingresso-prime/index.html" || true

            echo "=== CADDYFILE ==="
            cat /etc/caddy/Caddyfile 2>&1 || true

            echo "=== SUDO ==="
            if sudo -n true 2>/dev/null; then
              echo "SUDO_NON_INTERATTIVO=SI"
            else
              echo "SUDO_NON_INTERATTIVO=NO"
            fi

            echo "=== CADDY STATUS ==="
            systemctl is-active caddy 2>&1 || true
