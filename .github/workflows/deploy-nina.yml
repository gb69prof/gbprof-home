name: Inspect Nina deploy path

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-nina.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server paths
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "USER=$(whoami)"
            echo "HOME=$HOME"
            pwd
            id
            ls -ld /opt /opt/gbprof /opt/gbprof/projects || true
            ls -ld /opt/gbprof/projects/gbprof-home || true
            test -w /opt/gbprof/projects/gbprof-home && echo "GBPROF_HOME_WRITABLE=yes" || echo "GBPROF_HOME_WRITABLE=no"
            test -w "$HOME" && echo "HOME_WRITABLE=yes" || echo "HOME_WRITABLE=no"
            git -C /opt/gbprof/projects/gbprof-home remote -v || true
